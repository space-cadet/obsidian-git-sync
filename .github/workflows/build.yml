name: Build plugin

on:
  push:
    branches:
      - main
      - "codex/**"
      - "rewrite/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_NAME: obsidian-git-sync

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm run build

      - name: Verify plugin files
        run: test -s main.js && test -s manifest.json && test -s styles.css

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-git-sync
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  release-dev-build:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: obsidian-git-sync
          path: release

      - name: Create plugin archive
        working-directory: release
        run: zip -r "../${{ env.PLUGIN_NAME }}.zip" main.js manifest.json styles.css

      - name: Read commit subject
        id: commit
        run: echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Update branch development tag
        run: |
          tag="latest-dev-${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "${{ github.sha }}"
          git push --force origin "refs/tags/$tag"

      - name: Create or update branch pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-dev-${{ github.ref_name }}
          name: "Dev Build (${{ github.ref_name }})"
          body: |
            Automated development build from `${{ github.ref_name }}`.

            **Commit:** `${{ github.sha }}`
            **Subject:** `${{ steps.commit.outputs.subject }}`
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            ${{ env.PLUGIN_NAME }}.zip
            release/main.js
            release/manifest.json
            release/styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
